assembly: "MVTec screw"
category: "screw"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["manipulated_front", "scratch_head", "scratch_neck", "thread_side", "thread_top"]
steps:
  - id: "inspect"
    instruction: "Place one screw under the camera for inspection."
    checks:
      - id: "screw_defect_free"
        type: "visual"
        question: "Is this screw free of defects such as manipulated front, scratch head, scratch neck, thread side, thread top? Answer no and box the defect if any is visible."
        show: "Fill the frame with the screw, even light, no glare."

  - id: "box"
    instruction: "Pack the screw into the box."
    hides: true
    requires: ["screw_defect_free"]
