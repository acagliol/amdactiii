assembly: "MVTec leather"
category: "leather"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["color", "cut", "fold", "glue", "poke"]
steps:
  - id: "inspect"
    instruction: "Place one leather under the camera for inspection."
    checks:
      - id: "leather_defect_free"
        type: "visual"
        question: "Is this leather free of defects such as color, cut, fold, glue, poke? Answer no and box the defect if any is visible."
        show: "Fill the frame with the leather, even light, no glare."

  - id: "box"
    instruction: "Pack the leather into the box."
    hides: true
    requires: ["leather_defect_free"]
