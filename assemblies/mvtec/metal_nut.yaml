assembly: "MVTec metal_nut"
category: "metal_nut"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["bent", "color", "flip", "scratch"]
steps:
  - id: "inspect"
    instruction: "Place one metal nut under the camera for inspection."
    checks:
      - id: "metal_nut_defect_free"
        type: "visual"
        question: "Is this metal nut free of defects such as bent, color, flip, scratch? Answer no and box the defect if any is visible."
        show: "Fill the frame with the metal nut, even light, no glare."

  - id: "box"
    instruction: "Pack the metal nut into the box."
    hides: true
    requires: ["metal_nut_defect_free"]
