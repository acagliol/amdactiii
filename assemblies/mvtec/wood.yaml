assembly: "MVTec wood"
category: "wood"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["color", "combined", "hole", "liquid", "scratch"]
steps:
  - id: "inspect"
    instruction: "Place one wood under the camera for inspection."
    checks:
      - id: "wood_defect_free"
        type: "visual"
        question: "Is this wood free of defects such as color, combined, hole, liquid, scratch? Answer no and box the defect if any is visible."
        show: "Fill the frame with the wood, even light, no glare."

  - id: "box"
    instruction: "Pack the wood into the box."
    hides: true
    requires: ["wood_defect_free"]
