assembly: "MVTec transistor"
category: "transistor"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["bent_lead", "cut_lead", "damaged_case", "misplaced"]
steps:
  - id: "inspect"
    instruction: "Place one transistor under the camera for inspection."
    checks:
      - id: "transistor_defect_free"
        type: "visual"
        question: "Is this transistor free of defects such as bent lead, cut lead, damaged case, misplaced? Answer no and box the defect if any is visible."
        show: "Fill the frame with the transistor, even light, no glare."

  - id: "box"
    instruction: "Pack the transistor into the box."
    hides: true
    requires: ["transistor_defect_free"]
