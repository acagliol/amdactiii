assembly: "MVTec zipper"
category: "zipper"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["broken_teeth", "combined", "fabric_border", "fabric_interior", "rough", "split_teeth", "squeezed_teeth"]
steps:
  - id: "inspect"
    instruction: "Place one zipper under the camera for inspection."
    checks:
      - id: "zipper_defect_free"
        type: "visual"
        question: "Is this zipper free of defects such as broken teeth, combined, fabric border, fabric interior, rough, split teeth, squeezed teeth? Answer no and box the defect if any is visible."
        show: "Fill the frame with the zipper, even light, no glare."

  - id: "box"
    instruction: "Pack the zipper into the box."
    hides: true
    requires: ["zipper_defect_free"]
