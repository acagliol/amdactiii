assembly: "MVTec grid"
category: "grid"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["bent", "broken", "glue", "metal_contamination", "thread"]
steps:
  - id: "inspect"
    instruction: "Place one grid under the camera for inspection."
    checks:
      - id: "grid_defect_free"
        type: "visual"
        question: "Is this grid free of defects such as bent, broken, glue, metal contamination, thread? Answer no and box the defect if any is visible."
        show: "Fill the frame with the grid, even light, no glare."

  - id: "box"
    instruction: "Pack the grid into the box."
    hides: true
    requires: ["grid_defect_free"]
