assembly: "MVTec bottle"
category: "bottle"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["broken_large", "broken_small", "contamination"]
steps:
  - id: "inspect"
    instruction: "Place one bottle under the camera for inspection."
    checks:
      - id: "bottle_defect_free"
        type: "visual"
        question: "Is this bottle free of defects such as broken large, broken small, contamination? Answer no and box the defect if any is visible."
        show: "Fill the frame with the bottle, even light, no glare."

  - id: "box"
    instruction: "Pack the bottle into the box."
    hides: true
    requires: ["bottle_defect_free"]
