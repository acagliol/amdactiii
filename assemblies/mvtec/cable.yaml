assembly: "MVTec cable"
category: "cable"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["bent_wire", "cable_swap", "combined", "cut_inner_insulation", "cut_outer_insulation", "missing_cable", "missing_wire", "poke_insulation"]
steps:
  - id: "inspect"
    instruction: "Place one cable under the camera for inspection."
    checks:
      - id: "cable_defect_free"
        type: "visual"
        question: "A correct cable assembly has intact outer black insulation, three straight wires in standard sequence (green-yellow, blue, and brown) with no missing or swapped wires, and fully intact inner insulation with no cuts, exposed copper, or bent strands. Does this cable match a correct assembly? If defective, answer no and box the defect."
        show: "Fill the frame with the cable, even light, no glare."

  - id: "box"
    instruction: "Pack the cable into the box."
    hides: true
    requires: ["cable_defect_free"]
