assembly: "MVTec toothbrush"
category: "toothbrush"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["defective"]
steps:
  - id: "inspect"
    instruction: "Place one toothbrush under the camera for inspection."
    checks:
      - id: "toothbrush_defect_free"
        type: "visual"
        question: "Is this toothbrush free of defects such as defective? Answer no and box the defect if any is visible."
        show: "Fill the frame with the toothbrush, even light, no glare."

  - id: "box"
    instruction: "Pack the toothbrush into the box."
    hides: true
    requires: ["toothbrush_defect_free"]
