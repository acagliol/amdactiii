assembly: "MVTec carpet"
category: "carpet"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["color", "cut", "hole", "metal_contamination", "thread"]
steps:
  - id: "inspect"
    instruction: "Place one carpet under the camera for inspection."
    checks:
      - id: "carpet_defect_free"
        type: "visual"
        question: "Is this carpet free of defects such as color, cut, hole, metal contamination, thread? Answer no and box the defect if any is visible."
        show: "Fill the frame with the carpet, even light, no glare."

  - id: "box"
    instruction: "Pack the carpet into the box."
    hides: true
    requires: ["carpet_defect_free"]
