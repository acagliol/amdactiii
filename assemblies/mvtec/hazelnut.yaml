assembly: "MVTec hazelnut"
category: "hazelnut"
# MVTec AD defect folders for this category (answer key lives in eval/, not here)
defect_types: ["crack", "cut", "hole", "print"]
steps:
  - id: "inspect"
    instruction: "Place one hazelnut under the camera for inspection."
    checks:
      - id: "hazelnut_defect_free"
        type: "visual"
        question: "Is this hazelnut free of defects such as crack, cut, hole, print? Answer no and box the defect if any is visible."
        show: "Fill the frame with the hazelnut, even light, no glare."

  - id: "box"
    instruction: "Pack the hazelnut into the box."
    hides: true
    requires: ["hazelnut_defect_free"]
